{% extends 'expenses/base.html' %}

{% block content %}
<h1>Summary</h1>
<table border="1" cellpadding="6" cellspacing="0">
    <tr>
        <th>category</th>
        <th>Total</th>
    </tr>
    {% for row in totals %}
    <tr>
        <td>{{row.category}}</td>
        <td>{{row.total}}</td>
    </tr>
    {% empty %}
    <tr><td colspan="2">No expenses yet</td></tr>
    {% endfor %}
    <tr>
        <th>Total</th>
        <th>{{grand_total}}</th>
    </tr>

</table>
{% endblock %}
